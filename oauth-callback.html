<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging in... - LX Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
        .font-gaming { font-family: 'Prompt', sans-serif; font-weight: 700; }
        .spinner {
            border: 4px solid rgba(102, 252, 241, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #66fcf1;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center">
    <div class="text-center">
        <div class="spinner mx-auto mb-6"></div>
        <h2 class="font-gaming text-2xl text-white mb-2">กำลังเข้าสู่ระบบ...</h2>
        <p class="text-gray-400">กรุณารอสักครู่ กำลังพาคุณไปยังหน้าหลัก</p>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const dataParam = urlParams.get('data');
        if (dataParam) {
            try {
                const data = JSON.parse(decodeURIComponent(dataParam));
                localStorage.setItem('lx_token', data.token);
                localStorage.setItem('lx_user', JSON.stringify(data.user));
                window.location.href = '/index.html';
            } catch (err) {
                console.error('Failed to parse user data');
                window.location.href = '/login.html?error=invalid_data';
            }
        } else {
            window.location.href = '/login.html';
        }
    </script>
</body>
</html>
