<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - LX Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'gamer-dark': '#0b0c10', 'gamer-gray': '#1f2833', 'gamer-lightgray': '#c5c6c7', 'gamer-cyan': '#66fcf1', 'gamer-teal': '#45a29e' }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'IBM Plex Sans Thai', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
        .font-gaming { font-family: 'Prompt', sans-serif; font-weight: 700; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=2070&auto=format&fit=crop')] bg-cover bg-center opacity-10"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-gamer-dark via-gamer-dark/80 to-transparent"></div>

    <div class="relative z-10 w-full max-w-md">
        <div class="text-center mb-8">
            <a href="/index.html" class="inline-block">
                <span class="font-gaming text-4xl font-bold text-white tracking-wider drop-shadow-[0_0_15px_rgba(102,252,241,0.5)]">LX<span class="text-gamer-cyan">SHOP</span></span>
            </a>
            <p class="text-gamer-lightgray mt-2 font-gaming">กู้คืนรหัสผ่านของคุณ</p>
        </div>

        <div class="bg-gamer-dark/80 backdrop-blur-md border border-gamer-teal/30 p-8 rounded-2xl shadow-[0_0_30px_rgba(69,162,158,0.2)]">
            
            <!-- Step 1: Request OTP -->
            <form id="request-otp-form" class="space-y-6">
                <h3 class="text-white font-bold text-xl mb-4 text-center">ลืมรหัสผ่านใช่หรือไม่?</h3>
                <p class="text-sm text-gamer-lightgray text-center mb-6">กรอกอีเมลที่คุณใช้สมัครสมาชิก เราจะส่งรหัส OTP 6 หลักไปให้เพื่อรีเซ็ตรหัสผ่านใหม่</p>
                <div>
                    <label class="block text-gamer-lightgray font-bold mb-2 text-sm">อีเมลที่ลงทะเบียน</label>
                    <input type="email" id="reset-email" required class="w-full bg-gamer-gray text-white border border-gamer-teal/30 rounded-xl py-3 px-4 focus:outline-none focus:border-gamer-cyan focus:ring-1 focus:ring-gamer-cyan transition-all" placeholder="your@email.com">
                </div>
                <button type="submit" class="w-full bg-gamer-cyan text-gamer-dark font-bold py-3 px-4 rounded-xl hover:bg-white hover:text-gamer-dark hover:shadow-[0_0_15px_rgba(102,252,241,0.6)] transition-all">
                    ส่งรหัส OTP
                </button>
            </form>

            <!-- Step 2: Verify OTP & New Password -->
            <form id="reset-password-form" class="space-y-6 hidden">
                <h3 class="text-white font-bold text-xl mb-4 text-center">ตั้งรหัสผ่านใหม่</h3>
                <p class="text-sm text-gamer-lightgray text-center mb-6">กรุณากรอกรหัส OTP ที่ได้รับทางอีเมล และตั้งรหัสผ่านใหม่</p>
                <div>
                    <label class="block text-gamer-lightgray font-bold mb-2 text-sm">รหัส OTP 6 หลัก</label>
                    <input type="text" id="reset-otp" required maxlength="6" class="w-full bg-gamer-gray text-white border border-gamer-teal/30 rounded-xl py-3 px-4 focus:outline-none focus:border-gamer-cyan text-center tracking-widest text-lg font-bold" placeholder="123456">
                </div>
                <div>
                    <label class="block text-gamer-lightgray font-bold mb-2 text-sm">รหัสผ่านใหม่</label>
                    <input type="password" id="new-password" required minlength="6" class="w-full bg-gamer-gray text-white border border-gamer-teal/30 rounded-xl py-3 px-4 focus:outline-none focus:border-gamer-cyan" placeholder="••••••••">
                </div>
                <button type="submit" class="w-full bg-gamer-cyan text-gamer-dark font-bold py-3 px-4 rounded-xl hover:bg-white hover:text-gamer-dark hover:shadow-[0_0_15px_rgba(102,252,241,0.6)] transition-all">
                    ยืนยันเปลี่ยนรหัสผ่าน
                </button>
            </form>

            <div class="mt-6 text-center text-sm">
                <a href="/login.html" class="text-gamer-teal hover:text-gamer-cyan transition-colors"><i class="fa-solid fa-arrow-left mr-1"></i> กลับไปหน้าเข้าสู่ระบบ</a>
            </div>
        </div>
    </div>

    <script>
        let currentEmail = '';

        document.getElementById('request-otp-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reset-email').value;
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังส่ง...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();
                alert(data.message);
                
                if (data.success) {
                    currentEmail = email;
                    document.getElementById('request-otp-form').classList.add('hidden');
                    document.getElementById('reset-password-form').classList.remove('hidden');
                }
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
            } finally {
                btn.innerHTML = 'ส่งรหัส OTP';
                btn.disabled = false;
            }
        });

        document.getElementById('reset-password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const otp = document.getElementById('reset-otp').value;
            const newPassword = document.getElementById('new-password').value;
            const btn = e.target.querySelector('button');
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังดำเนินการ...';
            btn.disabled = true;

            try {
                const res = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: currentEmail, otp, new_password: newPassword })
                });
                const data = await res.json();
                
                if (data.success) {
                    alert(data.message);
                    window.location.href = '/login.html';
                } else {
                    alert(data.message);
                    btn.innerHTML = 'ยืนยันเปลี่ยนรหัสผ่าน';
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('เกิดข้อผิดพลาดในการเชื่อมต่อ');
                btn.innerHTML = 'ยืนยันเปลี่ยนรหัสผ่าน';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
